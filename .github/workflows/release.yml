name: Release package

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a tarball, stage for npm approval, or finalize an approved publication
        type: choice
        options: [prepare, stage, finalize]
        default: prepare
        required: true
      commit:
        description: Full commit SHA on main with passing CI and a merged version PR
        type: string
        required: true
      version:
        description: Exact package version at that commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_SHA: ${{ inputs.commit }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_OPERATION: ${{ inputs.operation }}
  NPM_STABLE_RELEASES_ENABLED: ${{ vars.NPM_STABLE_RELEASES_ENABLED }}

jobs:
  prepare:
    if: github.repository == 'Mkalo/snowtyped' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Validate candidate inputs
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Require public source, reviewed versions, and exact-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs check "$RELEASE_VERSION" "$RELEASE_SHA"
      - run: pnpm check && pnpm test:versioning && pnpm test:release
      - name: Pack and test the actual release tarball
        run: |
          pnpm pack --pack-destination reports/release
          node scripts/release.mjs inspect "$RELEASE_VERSION" "$RELEASE_SHA"
          RELEASE_TARBALL="reports/release/snowtyped-$RELEASE_VERSION.tgz" pnpm test:package
          dist_tag="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("reports/release/release.json", "utf8")).tag)')"
          npm publish "reports/release/snowtyped-$RELEASE_VERSION.tgz" --dry-run --ignore-scripts --provenance=false --access public --tag "$dist_tag"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: npm-candidate-${{ inputs.commit }}-${{ github.run_attempt }}
          path: reports/release/
          retention-days: 14
          if-no-files-found: error

  stage:
    if: inputs.operation == 'stage'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned OIDC/staging-capable npm CLI
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          echo "NPM_CLI_JS=$(npm root --global)/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: reports/release
      - name: Stage identical validated bytes with OIDC and provenance
        run: node scripts/release.mjs stage "$RELEASE_VERSION" "$RELEASE_SHA"

  finalize:
    if: inputs.operation == 'finalize'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: reports/release
      - name: Verify published bytes and provenance
        run: |
          node scripts/release.mjs verify "$RELEASE_VERSION" "$RELEASE_SHA"
          npm install --prefix "$RUNNER_TEMP/npm-consumer" --ignore-scripts --no-audit --omit=optional "snowtyped@$RELEASE_VERSION"
          npm audit signatures --prefix "$RUNNER_TEMP/npm-consumer"
      - name: Create or verify the exact Git tag and changelog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs finalize "$RELEASE_VERSION" "$RELEASE_SHA"
