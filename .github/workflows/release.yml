name: Release package

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Preview a tarball or retry the complete release
        type: choice
        options: [prepare, release]
        default: prepare
        required: true
      commit:
        description: Full commit SHA on main with passing CI and a merged version PR
        type: string
        required: false
      version:
        description: Exact package version at that commit
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_SHA: ${{ inputs.commit || github.sha }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_OPERATION: ${{ github.event_name == 'workflow_run' && 'release' || inputs.operation }}
  NPM_STABLE_RELEASES_ENABLED: ${{ vars.NPM_STABLE_RELEASES_ENABLED }}

jobs:
  prepare:
    if: >-
      github.repository == 'Mkalo/snowtyped' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (vars.NPM_RELEASES_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      version: ${{ steps.identity.outputs.version }}
      eligible: ${{ steps.candidate.outputs.eligible != 'false' }}
    steps:
      - name: Validate candidate inputs
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the candidate to belong to main before executing its code
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
      - name: Resolve the version from the candidate
        id: identity
        run: |
          version="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]] || exit 1
          [[ -z "$RELEASE_VERSION" || "$RELEASE_VERSION" == "$version" ]] || exit 1
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Skip unversioned changes and completed releases
        id: candidate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs candidate "$RELEASE_VERSION" "$RELEASE_SHA"
      - name: Require public source, reviewed versions, and exact-commit CI
        if: steps.candidate.outputs.eligible != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs check "$RELEASE_VERSION" "$RELEASE_SHA"
      - run: pnpm check && pnpm test:versioning && pnpm test:release
        if: steps.candidate.outputs.eligible != 'false'
      - name: Pack and test the actual release tarball
        if: steps.candidate.outputs.eligible != 'false'
        run: |
          pnpm pack --pack-destination reports/release
          node scripts/release.mjs inspect "$RELEASE_VERSION" "$RELEASE_SHA"
          RELEASE_TARBALL="reports/release/snowtyped-$RELEASE_VERSION.tgz" pnpm test:package
          dist_tag="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("reports/release/release.json", "utf8")).tag)')"
          npm publish "reports/release/snowtyped-$RELEASE_VERSION.tgz" --dry-run --ignore-scripts --provenance=false --access public --tag "$dist_tag"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        if: steps.candidate.outputs.eligible != 'false'
        with:
          name: npm-candidate-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: reports/release/
          retention-days: 14
          if-no-files-found: error

  stage:
    if: (github.event_name == 'workflow_run' || inputs.operation == 'release') && needs.prepare.outputs.eligible == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the candidate to belong to main before executing its code
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the pinned OIDC/staging-capable npm CLI
        run: |
          npm install --global npm@12.2.1 --ignore-scripts
          echo "NPM_CLI_JS=$(npm root --global)/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: reports/release
      - name: Stage identical validated bytes with OIDC and provenance
        run: node scripts/release.mjs stage "$RELEASE_VERSION" "$RELEASE_SHA"

  await-approval:
    needs: [prepare, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the candidate to belong to main before executing its code
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: reports/release
      - name: Wait up to one hour for npm approval without publishing credentials
        run: node scripts/release.mjs wait "$RELEASE_VERSION" "$RELEASE_SHA"

  finalize:
    needs: [prepare, await-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the candidate to belong to main before executing its code
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: reports/release
      - name: Verify published bytes and provenance
        run: |
          node scripts/release.mjs verify "$RELEASE_VERSION" "$RELEASE_SHA"
          npm install --prefix "$RUNNER_TEMP/npm-consumer" --ignore-scripts --no-audit --omit=optional "snowtyped@$RELEASE_VERSION"
          npm audit signatures --prefix "$RUNNER_TEMP/npm-consumer"
      - name: Create or verify the exact Git tag and changelog release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs finalize "$RELEASE_VERSION" "$RELEASE_SHA"

  docs:
    needs: [prepare, finalize]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      tag: v${{ needs.prepare.outputs.version }}
