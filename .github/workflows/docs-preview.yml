name: Docs preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'snowtyped-docs' }}

jobs:
  deploy:
    name: Deploy pull request preview
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: docs-preview
    concurrency:
      group: docs-preview-${{ github.event.workflow_run.pull_requests[0].number }}
    permissions:
      actions: read
      contents: read
      statuses: write
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: website
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: ${{ runner.temp }}/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Stage the built site under the production base path
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
        run: node website/scripts/preview.ts stage "$RUNNER_TEMP/dist" "$RUNNER_TEMP/preview"
      - name: Upload static files to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.151.3 pages deploy "$RUNNER_TEMP/preview" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "pr-$PR_NUMBER" \
            --commit-hash "$HEAD_SHA" --commit-dirty=true
      - name: Link the preview from the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success -f context="Docs preview" -f description="Preview of the built docs" \
            -f target_url="https://pr-$PR_NUMBER.$CLOUDFLARE_PAGES_PROJECT.pages.dev/"

  cleanup:
    name: Remove previews of closed pull requests
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: docs-preview
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: website
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node website/scripts/preview.ts cleanup
